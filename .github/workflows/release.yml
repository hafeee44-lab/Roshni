name: Release

# Push a tag like v2.1.0 to build a signed APK and app bundle and publish them as a GitHub Release.
# The APK is for sideloading; the .aab is what gets uploaded to Google Play.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROSHNI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ROSHNI_KEYSTORE_BASE64, ROSHNI_KEYSTORE_PASSWORD and ROSHNI_KEY_PASSWORD secrets first (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roshni.jks"
          echo "ROSHNI_KEYSTORE=$RUNNER_TEMP/roshni.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK and app bundle
        env:
          ROSHNI_KEYSTORE_PASSWORD: ${{ secrets.ROSHNI_KEYSTORE_PASSWORD }}
          ROSHNI_KEY_ALIAS: roshni
          ROSHNI_KEY_PASSWORD: ${{ secrets.ROSHNI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="Roshni-${TAG}.apk"
          AAB="Roshni-${TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$APK" > "$APK.sha256"
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NOTES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" "$APK.sha256" "$AAB" --title "Roshni ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" "$APK.sha256" "$AAB" --title "Roshni ${TAG#v}" --generate-notes
          fi
